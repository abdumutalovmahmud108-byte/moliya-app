<!DOCTYPE html>
<html lang="uz" data-theme="auto" data-fs="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shaxsiy moliya</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Rang tizimi: har rang bitta ma'noni bildiradi.
   yashil = kirim / ijobiy natija · qizil = xarajat / kamomad · sariq = diqqat
   ko'k = Zarur · to'q sariq = Xohish · pushti = Jamg'arma · kulrang = hisobga kirmaydi */
:root{
  --bg:#f3f4f6;--card:#ffffff;--ink:#0f172a;--ink2:#334155;--mute:#5b6878;--line:#e2e8f0;--chip:#f1f5f9;--key:#e8edf3;
  --acc:#0f766e;--accink:#ffffff;--accsoft:#ccfbf1;
  --in:#147a3a;--in-bg:#dcfce7;--in-f:#15803d;--in-fi:#ffffff;
  --out:#c81e1e;--out-bg:#fee2e2;--out-f:#d42020;--out-fi:#ffffff;
  --warn:#b45309;--warn-bg:#fef3c7;--danger:#b91c1c;
  --z:#1d4ed8;--z-bg:#dbeafe;--zm:#2a78d6;
  --x:#c2410c;--x-bg:#ffedd5;--xm:#eb6834;
  --j:#be185d;--j-bg:#fce7f3;--jm:#d6409f;--q:#6d28d9;--q-bg:#ede9fe;
  --inm:#1a7f37;--outm:#ef6b5b;--barn:#a3b1c2;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  --t-xs:.87rem;--t-s:.93rem;--t-m:1rem;--t-l:1.13rem;--t-xl:1.47rem;--t-xxl:2.13rem;--t-hero:2.93rem;
  --kb:0px;--vh:100vh;color-scheme:light
}
html[data-theme="dark"]{
  --bg:#0b1117;--card:#151c24;--ink:#e6edf3;--ink2:#c3ced9;--mute:#8d9aa8;--line:#26313d;--chip:#1b242e;--key:#1f2933;
  --acc:#2dd4bf;--accink:#042f2e;--accsoft:#134e4a;
  --in:#4ade80;--in-bg:#12301f;--in-f:#4ade80;--in-fi:#052e16;
  --out:#f87171;--out-bg:#3b1719;--out-f:#f87171;--out-fi:#2b0707;
  --warn:#fbbf24;--warn-bg:#33270b;--danger:#f87171;
  --z:#7fb2f5;--z-bg:#13253f;--zm:#3987e5;
  --x:#fb9a63;--x-bg:#38210f;--xm:#d95926;
  --j:#f17ac0;--j-bg:#37162a;--jm:#c94a9a;--q:#b39cfb;--q-bg:#2a2048;
  --inm:#22a55b;--outm:#e5625c;--barn:#4b5866;
  --shadow:none;color-scheme:dark
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#0b1117;--card:#151c24;--ink:#e6edf3;--ink2:#c3ced9;--mute:#8d9aa8;--line:#26313d;--chip:#1b242e;--key:#1f2933;
    --acc:#2dd4bf;--accink:#042f2e;--accsoft:#134e4a;
    --in:#4ade80;--in-bg:#12301f;--in-f:#4ade80;--in-fi:#052e16;
    --out:#f87171;--out-bg:#3b1719;--out-f:#f87171;--out-fi:#2b0707;
    --warn:#fbbf24;--warn-bg:#33270b;--danger:#f87171;
    --z:#7fb2f5;--z-bg:#13253f;--zm:#3987e5;
    --x:#fb9a63;--x-bg:#38210f;--xm:#d95926;
    --j:#f17ac0;--j-bg:#37162a;--jm:#c94a9a;--q:#b39cfb;--q-bg:#2a2048;
    --inm:#22a55b;--outm:#e5625c;--barn:#4b5866;
    --shadow:none;color-scheme:dark
  }
}
html{font-size:15px}
html[data-fs="s"]{font-size:13.5px}
html[data-fs="l"]{font-size:17.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-m)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.story b{white-space:nowrap}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acc);z-index:20;transition:width .3s,opacity .3s;opacity:0}
#bar.on{opacity:1;width:70%;transition:width 8s cubic-bezier(.1,.6,.3,1)}
#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.ttl{font-size:var(--t-l);font-weight:700;margin:0 0 2px}
.sub{font-size:var(--t-xs);color:var(--mute);margin:0 0 12px}
.lbl{font-size:var(--t-xs);color:var(--mute)}
.seg{display:flex;background:var(--key);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;padding:6px 8px;border-radius:9px;font-weight:600;font-size:var(--t-s);color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.on.xo{background:var(--out-bg);color:var(--out);box-shadow:inset 0 0 0 1.5px var(--out)}
.seg button.on.ki{background:var(--in-bg);color:var(--in);box-shadow:inset 0 0 0 1.5px var(--in)}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:6px 14px;font-size:var(--t-s);color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.set{border-color:var(--acc);color:var(--ink);font-weight:600}
.go{width:100%;border:0;background:var(--acc);color:var(--accink);border-radius:14px;min-height:52px;padding:12px;font-size:var(--t-l);font-weight:700}
.go.xo{background:var(--out-f);color:var(--out-fi)}
.go.ki{background:var(--in-f);color:var(--in-fi)}
.go:disabled{background:var(--key);color:var(--mute)}
.go.busy{opacity:.7;pointer-events:none}
.ghost{width:100%;border:1px solid var(--line);background:transparent;border-radius:14px;min-height:48px;padding:10px;font-weight:600;color:var(--ink2);margin-top:8px}
.ghost.danger{color:var(--danger);border-color:var(--danger)}
.ghost.dfill{background:var(--danger);color:#fff;border-color:var(--danger)}
.ghost.busy{opacity:.6;pointer-events:none}
.empty{color:var(--mute);text-align:center;padding:32px 12px;font-size:var(--t-s)}

/* ma'noli rang sinflari */
.t-in{color:var(--in)}.t-out{color:var(--out)}.t-warn{color:var(--warn)}.t-mute{color:var(--mute)}
.t-z{color:var(--z)}.t-x{color:var(--x)}.t-j{color:var(--j)}
.neg{color:var(--danger)!important}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:var(--t-xs);font-weight:700;line-height:1.55;white-space:nowrap;background:var(--chip);color:var(--mute)}
.tag.in{background:var(--in-bg);color:var(--in)}.tag.out{background:var(--out-bg);color:var(--out)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.z{background:var(--z-bg);color:var(--z)}.tag.x{background:var(--x-bg);color:var(--x)}.tag.j{background:var(--j-bg);color:var(--j)}
.tag.sm{padding:0 6px;font-size:.78rem;font-weight:700}
.ic{flex:0 0 38px;height:38px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.ic.in{background:var(--in-bg)}.ic.z{background:var(--z-bg)}.ic.x{background:var(--x-bg)}.ic.j{background:var(--j-bg)}.ic.n{background:var(--chip)}
.ic.sm{flex-basis:34px;height:34px;font-size:1.05rem;border-radius:10px}

/* --- Yozish --- */
.yoz{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px}
.yrow{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;flex-shrink:0}
.yrow .seg{flex:1 1 210px}
.bal{flex:1 0 auto;text-align:right;line-height:1.2;white-space:nowrap}
.bal b{display:block;font-size:var(--t-m)}
.yrow.wrap .bal{text-align:center}
.yrow.wrap .bal b{display:inline;margin-left:6px}
.amt{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.amt .v{font-size:var(--t-hero);font-weight:800;line-height:1.05}
.amt .v.m{font-size:var(--t-xxl)}.amt .v.s{font-size:var(--t-xl)}
.amt .v.zero{color:var(--mute);opacity:.5}
.amt .c{font-size:var(--t-s);color:var(--mute);margin-top:2px}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;max-width:100%}
.meta .pill{flex:0 1 auto}
.cats{flex-shrink:0;display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 24px 1px 1px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cats::-webkit-scrollbar{display:none}
.cats.one{grid-template-rows:auto}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:6px 12px;font-size:var(--t-s);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip .e{font-size:1.15em}
.chip.on{font-weight:700;color:var(--ink)}
.chip.on.xo{background:var(--out-bg);border-color:var(--out);box-shadow:inset 0 0 0 1px var(--out)}
.chip.on.ki{background:var(--in-bg);border-color:var(--in);box-shadow:inset 0 0 0 1px var(--in)}
.chip.add{border-style:dashed;color:var(--acc);font-weight:600;background:transparent}
.pad{flex:2 1 0;min-height:176px;max-height:360px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(38px,1fr));gap:8px}
.yoz .go{flex-shrink:0}
.pad button{border:0;background:var(--key);border-radius:12px;font-size:var(--t-xl);font-weight:600;min-height:38px}
.pad button:active,.chip:active,.it:active,.pill:active,.trow:active{opacity:.6}
.yoz .go{position:sticky;bottom:0;box-shadow:0 -6px 12px var(--bg)}
.srow{display:flex;gap:8px;flex-shrink:0;position:sticky;bottom:0;box-shadow:0 -6px 12px var(--bg);background:var(--bg)}
.srow .go{flex:1 1 auto;width:auto;position:static;box-shadow:none}
.bolb{flex:0 0 auto;align-self:stretch;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-weight:700;font-size:var(--t-s);color:var(--ink2);white-space:nowrap}
.bolb:disabled{opacity:.45}
.go.ot{background:var(--z);color:#fff}
.seg button.on.ot{background:var(--z-bg);color:var(--z);box-shadow:inset 0 0 0 1.5px var(--z)}
.otk{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.otk .col{min-width:0;display:flex;flex-direction:column;gap:6px}
.otk .lbl{font-size:var(--t-xs);color:var(--mute);margin:0 2px}
.otk .hp{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:6px 10px;text-align:left;font-size:var(--t-s);line-height:1.25;overflow:hidden}
.otk .hp small{display:block;color:var(--mute);font-size:var(--t-xs)}
.otk .hp.on{border-color:var(--z);box-shadow:inset 0 0 0 1px var(--z);background:var(--z-bg);font-weight:700}
.otk .sw{align-self:center;margin-top:18px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.1rem;color:var(--z)}
.t-q{color:var(--q)}.ic.q{background:var(--q-bg)}.tag.q{background:var(--q-bg);color:var(--q)}
.go.qz{background:var(--q);color:#fff}
.go.qz:disabled,.go.ot:disabled{background:var(--key);color:var(--mute)}
.seg.s4 button{padding:6px 3px}
.seg button.on.qz{background:var(--q-bg);color:var(--q);box-shadow:inset 0 0 0 1.5px var(--q)}
.qbox{flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.qsum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:var(--t-xs);color:var(--ink2);text-align:left}
.qsum b{font-size:var(--t-s)}.qsum .go2{margin-left:auto;color:var(--q);font-weight:700;white-space:nowrap}
.qtur{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qtur button{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:42px;padding:6px 8px;font-size:var(--t-s);font-weight:600;color:var(--ink2);text-align:left;line-height:1.2}
.qtur button small{display:block;font-weight:500;font-size:var(--t-xs);color:var(--mute)}
.qtur button.on{border-color:var(--q);background:var(--q-bg);color:var(--q);box-shadow:inset 0 0 0 1px var(--q)}
.qlbl{font-size:var(--t-xs);color:var(--mute);margin:2px 2px -2px}
.chip.on.qz{background:var(--q-bg);border-color:var(--q);box-shadow:inset 0 0 0 1px var(--q)}
.chip small{font-size:var(--t-xs);font-weight:600}
.qtot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.qtot>div{border-radius:12px;padding:10px 12px;background:var(--chip)}
.qtot span{display:block;font-size:var(--t-xs);color:var(--mute);line-height:1.3}.qtot b{font-size:var(--t-l)}
.qrow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;text-align:left;color:var(--ink)}
.qrow .nm{flex:1;min-width:0}.qrow .nm b{display:block;font-size:var(--t-m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qrow .nm small{font-size:var(--t-xs);color:var(--mute)}
.qrow .sm{text-align:right;white-space:nowrap}.qrow .sm b{display:block;font-size:var(--t-m)}.qrow .sm small{font-size:var(--t-xs);color:var(--mute)}
.qrow.yop{opacity:.6}
.qhero{text-align:center;padding:6px 0 12px}.qhero b{display:block;font-size:var(--t-xxl);line-height:1.15}.qhero span{font-size:var(--t-s);color:var(--ink2)}
.qwarn{color:var(--danger);font-weight:700}
details.qyop summary{cursor:pointer;color:var(--mute);font-size:var(--t-s);padding:10px 2px}
.klim{flex-shrink:0;display:flex;flex-direction:column;gap:5px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;text-align:left;font-size:var(--t-xs);color:var(--ink2)}
.klim b{font-size:var(--t-s);color:var(--ink)}.klim .num{white-space:nowrap}.klim.out b.n{color:var(--out)}
.bbar{display:block;height:6px;border-radius:3px;background:var(--key);overflow:hidden;position:relative}
.bbar i{display:block;height:100%;border-radius:3px;background:var(--in)}
.bbar.warn i,.klim.warn .bbar i{background:var(--warn)}.bbar.out i,.klim.out .bbar i{background:var(--out)}
.bbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink2);opacity:.55}
.klim.out{border-color:var(--out)}.klim.warn{border-color:var(--warn)}
.brw{display:block;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.brw:last-of-type{border-bottom:0}
.brw .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.brw .hd .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brw .hd .vv{text-align:right;white-space:nowrap;font-size:var(--t-s)}.brw .hd .vv small{display:block;font-size:var(--t-xs);color:var(--mute)}
.rf{width:100%;border-collapse:collapse;font-size:var(--t-xs)}.rf th{color:var(--mute);font-weight:600;text-align:right;padding:4px 2px}.rf th:first-child,.rf td:first-child{text-align:left}.rf td{text-align:right;padding:6px 2px;border-top:1px solid var(--line);white-space:nowrap}.rf tr.on td{font-weight:700}
.bsum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 6px;flex-wrap:wrap}.bsum b{font-size:var(--t-l)}
.otk .tip{grid-column:1/-1;font-size:var(--t-xs);color:var(--mute);margin:0 2px;line-height:1.4}
/* past ekran (Telegram yarim ochilgan, kichik telefon) */
@media (max-height:660px){
  .yoz{gap:7px;padding:7px 10px 8px}
  .yoz .seg button{min-height:34px;padding:4px 8px}
  .bal b{display:inline;margin-left:6px}
  .amt .v{font-size:var(--t-xxl)}.amt .v.m{font-size:var(--t-xl)}.amt .v.s{font-size:var(--t-l)}
  .amt .c{display:none}
  .meta{margin-top:4px}.meta .pill{min-height:34px;padding:4px 12px}
  .cats{grid-template-rows:auto}
  .chip{min-height:40px}
  .pad{min-height:154px;gap:6px;grid-template-rows:repeat(4,minmax(34px,1fr))}
  .pad button{min-height:34px;font-size:var(--t-l)}
  .yoz .go{min-height:46px}
  nav button{min-height:44px;padding:4px 2px}
  nav button .e{font-size:1.05rem}
}
@media (max-height:540px){
  .meta .pill{min-height:32px}
  .pad{min-height:146px;grid-template-rows:repeat(4,minmax(32px,1fr))}
  .pad button{min-height:32px}
}

/* --- Yozuvlar --- */
.tb{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 12px 8px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tb .r{display:flex;gap:8px;flex-wrap:wrap}
.tb .r .seg{flex:1 1 230px}
.tb .r select{flex:1 1 150px;width:auto}
.fld{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:46px;padding:10px 12px;font-size:var(--t-m)}
.fld:focus{outline:2px solid var(--acc);outline-offset:-1px}
select.fld{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.mh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin:16px 4px 6px}
.mh>b{white-space:nowrap}
.mh>span>*{white-space:nowrap}
.mh b{font-size:var(--t-l)}
.mh>span{font-size:var(--t-xs);color:var(--mute);text-align:right}
.mh>span b{font-size:inherit}
.dh{display:flex;justify-content:space-between;gap:8px;font-size:var(--t-xs);color:var(--mute);margin:10px 6px 4px}
.dh .hi{color:var(--warn);font-weight:700}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 12px;box-shadow:var(--shadow)}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:56px}
.it:last-child{border-bottom:0}
.it .tx{flex:1;min-width:0}
.it .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx .n{font-size:var(--t-xs);color:var(--mute)}
.it .am{text-align:right;white-space:nowrap}
.it .am b{font-size:var(--t-m)}
.it .am div{font-size:var(--t-xs);color:var(--mute)}
.it .am .tag{margin-right:4px}
.it.pend{opacity:.6}
.it.fail .am div{color:var(--danger);font-weight:600}

/* --- Hisobot --- */
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mnav button{flex:0 0 48px;height:48px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-size:1.4rem;color:var(--ink)}
.mnav button:disabled{opacity:.3}
.mnav div{flex:1;text-align:center;line-height:1.25}
.mnav b{font-size:var(--t-l);display:block}
.mnav small{font-size:var(--t-xs);color:var(--mute)}
.story{font-size:var(--t-m);line-height:1.6;color:var(--ink2)}
.story b{color:var(--ink)}
.story b.t-in{color:var(--in)}.story b.t-out{color:var(--out)}.story b.t-warn{color:var(--warn)}.story b.t-z{color:var(--z)}.story b.t-x{color:var(--x)}.story b.t-j{color:var(--j)}
.story .tip{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;font-size:var(--t-s)}

/* Qoldiq necha kunga yetadi: oxirgi 30 kundagi o'rtacha kunlik xarajat bo'yicha */
function zaxira(q) {

  var lim = addDays(S.bugun, -29), sum = 0, first = S.bugun;
  S.yozuvlar.forEach(function (y) {
    if (y.sana < first) first = y.sana;
    if (hisobla(y) && y.tur !== 'Daromad' && y.sana >= lim) sum += y.uzs;
  });
  var span = Math.min(30, Math.round((dt(S.bugun) - dt(first)) / 864e5) + 1);
  if (!sum || span < 3) return { cls: '', d: 0, txt: '', tag: '' };
  var d = Math.floor(q / (sum / span));
  if (d < 7) return { cls: 't-out', d: d, txt: '≈ ' + d + ' kunga yetadi', tag: 'out' };
  if (d < 14) return { cls: 't-warn', d: d, txt: '≈ ' + d + ' kunga yetadi', tag: 'warn' };
  return { cls: 't-in', d: d, txt: d > 365 ? '1 yildan ko\'proqqa yetadi' : '≈ ' + d + ' kunga yetadi', tag: 'in' };
}

function ovoz(tur) {

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();

    n.forEach(function (x) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = x[0];
      g.gain.setValueAtTime(0.0001, t0 + x[1]);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + x[1] + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + x[1] + x[2]);
      o.connect(g); g.connect(AC.destination); o.start(t0 + x[1]); o.stop(t0 + x[1] + x[2] + 0.03);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(tur === 'Daromad' ? [15, 40, 15] : 15); } catch (e) {}
}
